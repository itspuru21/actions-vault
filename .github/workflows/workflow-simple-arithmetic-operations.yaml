name: Test Arithmetic Calculator

on:
  workflow_dispatch:

jobs:
  run-calculator:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Calculator Action
        id: calc
        uses: ./docker-actions/python/fun-actions/simple-arithmetic-operations
        with:
          num1: '50'
          num2: '5'

      - name: Display All Results
        run: |
          echo "Sum: ${{ steps.calc.outputs.sum }}"
          echo "Difference: ${{ steps.calc.outputs.difference }}"
          echo "Product: ${{ steps.calc.outputs.product }}"
          echo "Quotient: ${{ steps.calc.outputs.quotient }}"